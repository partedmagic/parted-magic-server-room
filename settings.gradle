plugins {
    // Lets Gradle auto-download a JDK 25 toolchain if none is installed locally
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// The game's name without spaces: the jar, build/install and the release
// zips are named after it (build.gradle's appName is the name players see)
rootProject.name = 'PartedMagicServerRoom'
